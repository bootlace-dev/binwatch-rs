[package]
name = "binwatch"
version = "0.0.1-rc0"
edition = "2021"
authors = ["bootlace-dev <bootlace-dev@users.noreply.github.com>"]
description = "Deterministic Bitcoin binary integrity auditor and decentralized attestation publisher"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"

[[bin]]
name = "binwatch"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
