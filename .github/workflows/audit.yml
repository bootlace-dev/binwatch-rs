name: BinWatch Integrity Audit

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BinWatch Engine
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Install pipek1 binary
        run: |
          curl -sL https://github.com/bootlace-dev/pipek1/releases/download/v0.0.1-rc0/pipek1 -o /tmp/pipek1
          chmod +x /tmp/pipek1
          sudo mv /tmp/pipek1 /usr/local/bin/pipek1

      - name: Compile binwatch
        run: cargo build --release

      - name: Run Binary Integrity Audit Matrix
        run: |
          mkdir -p public
          cp public_index_template.html public/index.html
          ./scripts/audit_matrix.sh public/manifest.json
          ./target/release/binwatch digest public/manifest.json > public/digest.txt
          gzip -9 -c public/manifest.json > public/manifest.json.gz
          echo "Audit completed. Seal: $(cat public/manifest.json | jq -r '.hex_seal')"
          cat public/digest.txt

      - name: Broadcast Nostr Kind 1 Digest Note
        env:
          NOSTR_BOT_NSEC: ${{ secrets.NOSTR_BOT_NSEC }}
        run: |
          pip install websockets
          python3 ./scripts/nostr_broadcast.py public/digest.txt public/manifest.json

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
