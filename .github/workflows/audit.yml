name: BinWatch Integrity Audit

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BinWatch Engine
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile binwatch
        run: cargo build --release

      - name: Run Binary Integrity Audit Matrix
        run: |
          ./target/release/binwatch demo
          ./target/release/binwatch seal demo_manifest.json || true

      - name: Generate Public Merkle Badge & Nostr Digest
        run: |
          echo "Audit completed. Seal generated."
